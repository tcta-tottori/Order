# GitHub Pages へ配信する。
# github-pages 環境は Pages の配信元ブランチからのデプロイしか許可しないため、
# トリガーは配信元ブランチだけにする（main から動かすと保護ルールで失敗する）。
# 配信元ブランチを変えたら、下の branches も合わせて変えること。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/mobile-excel-sheet-viewer-xju6fi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
