name: Build Android APK

# 版番号 (index.html の data-ver) が上がったら APK を組んでリリースに置く。
# 同じ版のリリースが既にあるときは作り直さない。
on:
  push:
    branches: [claude/mobile-excel-sheet-viewer-xju6fi]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'icons/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 版番号を取り出す
        id: ver
        run: |
          VER=$(grep -o 'data-ver="[^"]*"' index.html | head -1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then echo "版番号を取り出せませんでした" >&2; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Order View v$VER"

      # 署名鍵は毎回同じものでなければ上書きインストールできない。
      # Secrets に入っていればそれを使い、無ければリポジトリ同梱の鍵で署名する。
      - name: 署名鍵を用意する
        id: sign
        env:
          KS: ${{ secrets.OV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/orderview.jks"
            echo "OV_KEYSTORE=$RUNNER_TEMP/orderview.jks" >> "$GITHUB_ENV"
            echo "同梱の鍵ではなく Secrets の鍵で署名します"
          else
            echo "リポジトリ同梱の鍵で署名します"
          fi

      - name: APK を組む
        env:
          OV_KEYSTORE_PASSWORD: ${{ secrets.OV_KEYSTORE_PASSWORD }}
          OV_KEY_ALIAS: ${{ secrets.OV_KEY_ALIAS }}
          OV_KEY_PASSWORD: ${{ secrets.OV_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: 配布名に付け替える
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "APK が見つかりません" >&2; ls -R android/app/build/outputs || true; exit 1; }
          OUT="OrderView-${{ steps.ver.outputs.tag }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OrderView-${{ steps.ver.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: リリースに置く
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          EVENT: ${{ github.event_name }}
        run: |
          sed -e "s/__VERSION__/$VER/g" -e "s/__APK__/$(basename "$APK")/g" \
            android/release-notes.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              gh release upload "$TAG" "$APK" --clobber
              echo "既存のリリース $TAG に置き直しました"
            else
              echo "リリース $TAG は既にあるので何もしません"
            fi
          else
            gh release create "$TAG" "$APK" \
              --title "Order View $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
            echo "リリース $TAG を作りました"
          fi
